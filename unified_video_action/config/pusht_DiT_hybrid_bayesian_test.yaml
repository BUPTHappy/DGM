name: uva

defaults:
  - _self_
  - task: pusht
  - model: fast_policy_dit_hybrid

dataloader:
  batch_size: 32
  num_workers: 0
  persistent_workers: false
  pin_memory: true
  shuffle: true

val_dataloader:
  batch_size: 32
  num_workers: 0
  persistent_workers: false
  pin_memory: true
  shuffle: false

training:
  checkpoint_every: 5
  debug: false
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  max_train_steps: null
  max_val_steps: null
  num_epochs: 20  # 减少到20个epoch用于测试
  resume: true
  rollout_every: 1
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1
  mixed_precision: 'fp16'
  
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    monitor_key: test_mean_score
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 1
    mode: max

ema:
  _target_: unified_video_action.model.autoregressive.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

logging:
  group: null
  id: null
  mode: offline  # 改为offline模式，避免wandb API key问题
  name: train_uva_pusht_bayesian_test
  project: unified_video_action
  resume: false
  tags:
  - train_uva_pusht
  - pusht
  - bayesian_optimization
  - test

multi_run:
  run_dir: data/outputs/train_uva_pusht_bayesian_test
  wandb_name_base: train_uva_pusht_bayesian_test

payload: checkpoints/pusht.ckpt
freeze_submodules: true

save_folder: ./logs/time_logs/pusht_ucgm_few_steps_sample_4

# Bayesian Optimization Configuration for Testing
bayesian_optimization:
  enabled: true
  start_epoch: 8   # 在第8个epoch开始优化（40%的位置）
  interval: 4     # 每4个epoch优化一次
  max_trials: 3    # 减少试验次数用于快速测试
  n_test: 2        # 减少测试次数用于快速测试
  device: cuda:0
  output_dir: ./bayesian_optimization_test_logs
