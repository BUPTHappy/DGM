name: uva

defaults:
  - _self_
  - task: pusht
  - model: fast_policy

dataloader:
  batch_size: 32
  num_workers: 0
  persistent_workers: false
  pin_memory: true
  shuffle: true

val_dataloader:
  batch_size: 32
  num_workers: 0
  persistent_workers: false
  pin_memory: true
  shuffle: false

training:
  checkpoint_every: 10
  debug: false
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  max_train_steps: null
  max_val_steps: null
  num_epochs: 100
  resume: true
  rollout_every: 1
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1
  mixed_precision: 'fp16'
  
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    monitor_key: test_mean_score
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 1
    mode: max

ema:
  _target_: unified_video_action.model.autoregressive.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

logging:
  group: null
  id: null
  mode: offline
  name: train_uva_pusht
  project: unified_video_action
  resume: false
  tags:
  - train_uva_pusht
  - pusht
  - default

multi_run:
  run_dir: data/outputs/train_uva_pusht
  wandb_name_base: train_uva_pusht

payload: checkpoints/pusht_final_1/checkpoints/'epoch=0060-test_mean_score=0.963.ckpt'
freeze_submodules: true

save_folder: ./logs/time_logs/pusht_ucgm_few_steps_sample_4

# Bayesian Optimization Configuration for Pusht MLP
bayesian_optimization:
  enabled: true
  optimization_mode: "balanced"  # 可选: "performance", "speed", "balanced"
  start_epoch: 60  # 从3/4位置开始
  interval: 20      # 每10个epoch优化一次，更频繁的优化
  max_trials: 8      # 中期优化用8个trials
  final_trials: 15   # 最终优化用15个trials
  n_test: 3          # 正常优化用3个test
  final_n_test: 5    # 最终优化用5个test，更充分的评估
  device: cuda:0
  output_dir: ./bayesian_optimization_logs_pusht_mlp
  use_best_checkpoint_for_final: true  # 最终优化使用最优checkpoint
  
  # Parameter search space for Pusht MLP (16个参数)
  param_space:
    # UCGM Sampling parameters (6个)
    num_sampling_steps:
      type: int
      bounds: [1, 3]
    cfg:
      type: float
      bounds: [0.8, 1.5]
    temperature:
      type: float
      bounds: [0.7, 1.2]
    consistc_ratio:
      type: float
      bounds: [0.5, 1.0]
    extrapol_ratio:
      type: float
      bounds: [0.0, 0.6]
    rfba_gap_end:
      type: float
      bounds: [0.1, 0.8]
    
    # Local attention parameters (2个)
    window_size:
      type: int
      bounds: [0, 15]
    lambda_local:
      type: float
      bounds: [0.01, 0.8]
    
    # UCGM Training parameters (8个)
    ema_decay_rate:
      type: float
      bounds: [0.0, 0.999]
    scaled_cbl_eps:
      type: float
      bounds: [0.0, 10.0]
    transport_type:
      type: categorical
      choices: ['Linear', 'TrigFlow', 'Cosine', 'DDPM']
    lab_drop_ratio:
      type: float
      bounds: [0.0, 0.3]
    enhanced_ratio:
      type: float
      bounds: [0.0, 2.0]
    wt_cosine_loss:
      type: categorical
      choices: [True, False]
    weight_function:
      type: categorical
      choices: [None, 'Cosine']
    time_dist_ctrl_0:
      type: float
      bounds: [0.5, 2.5]
    time_dist_ctrl_1:
      type: float
      bounds: [0.5, 2.5]
    time_dist_ctrl_2:
      type: float
      bounds: [0.5, 2.5]