name: dish_washing
task_type: single_dataset
task_modes: []

shape_meta:
  image_resolution: 224  # Actual resolution from dataset
  action:
    shape:
      - 14  # Bimanual: robot0(7) + robot1(7) = 14D
            # Each arm: pos(3) + rot(3) + gripper(1) = 7D
  obs:
    image:
      shape:
        - 3
        - 224
        - 224
      type: rgb
    # Robot 0 state information (left arm)
    robot0_eef_pos:
      shape:
        - 3
      type: low_dim
    robot0_eef_rot_axis_angle:
      shape:
        - 3
      type: low_dim
    robot0_gripper_width:
      shape:
        - 1
      type: low_dim
    # Robot 1 state information (right arm)
    robot1_eef_pos:
      shape:
        - 3
      type: low_dim
    robot1_eef_rot_axis_angle:
      shape:
        - 3
      type: low_dim
    robot1_gripper_width:
      shape:
        - 1
      type: low_dim

dataset:
  _target_: unified_video_action.dataset.umi_bimanual_dataset.UmiBimanualDataset
  language_emb_model: null
  horizon: 32
  pad_after: 7
  pad_before: 1
  seed: 42
  val_ratio: 0.02
  data_aug: true
  normalizer_type: all
  dataset_path: data/dish_washing_0.zarr
  dataset_type: singletask

# No env_runner for real-world dataset - validation will use action L2 error
