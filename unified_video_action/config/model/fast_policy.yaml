_target_: unified_video_action.workspace.train_unified_video_action_workspace.TrainUnifiedVideoActionWorkspace

policy:
  _target_: unified_video_action.policy.unified_video_action_policy.UnifiedVideoActionPolicy
  selected_training_mode: null
  debug: None
  n_action_steps: 8
  use_proprioception: null
  use_history_action: null
  action_mask_ratio: 0.5
  different_history_freq: null
  predict_wrist_img: null
  predict_proprioception: null
  shape_meta: ${task.shape_meta}
  
  vae_model_params:
    autoencoder_path: pretrained_models/vae/kl16.ckpt
    ddconfig:
      vae_embed_dim: 16
      ch_mult: [1, 1, 2, 2, 4]

  autoregressive_model_params:
    pretrained_model_path: 'pretrained_models/mar/mar_base/checkpoint-last.pth'
    model_size: mar_base
    img_size: 256
    vae_stride: 16
    patch_size: 1
    vae_embed_dim: 16
    mask_ratio_min: 0.7
    label_drop_prob: 0.1
    attn_dropout: 0.1
    proj_dropout: 0.1
    # each frame 256 visual tokens, 4 frames as condition
    diffloss_d: 6
    diffloss_w: 1024
    diffloss_act_d: 6
    diffloss_act_w: 1024
    diffusion_batch_mul: 1
    grad_checkpointing: False
    use_ucgm: True
    num_sampling_steps: 2  # 贝叶斯优化最优值 (score: 0.9964)
    ucgmts_config:
      transport_type: "Linear"
      consistc_ratio: 0.8225843668899645  # 贝叶斯优化最优值
      scaled_cbl_eps: 0.0
      ema_decay_rate: 0.0
      rfba_gap_steps: [0.001, 0.7784207803666989]  # 贝叶斯优化最优值
      extrapol_ratio: 0.3251006307625289  # 贝叶斯优化最优值
    # Local attention parameters
    window_size: 12  # 贝叶斯优化最优值
    lambda_local: 0.13521376899022036  # 贝叶斯优化最优值
    token_pruning: False
    pruning_ratios: None
    restore_after_encoder: None
    #
    num_iter: 1
    cfg: 1.1047060125032149  # 贝叶斯优化最优值
    cfg_schedule: "linear"
    temperature: 0.7776702082687635  # 贝叶斯优化最优值
    predict_video: True
    #
    act_diff_training_steps: 1000
    act_diff_testing_steps: "100"
    
  action_model_params:
    predict_action: True
    act_model_type: conv_fc
    diff_model_type: MLP
    learn_sigma: false  # 不学 sigma，避免维度不匹配
  
  shift_action: True
    
  optimizer:
    learning_rate: 0.0001
    weight_decay: 0.02
    betas:
    - 0.9
    - 0.95
save_folder : profiling/ucgm_dit_vs_mlp/dit.txt



