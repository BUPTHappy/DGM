name: uva

defaults:
  - _self_
  - task: libero10
  - model: fast_policy

dataloader:
  batch_size: 32
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: true

val_dataloader:
  batch_size: 32
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: false

training:
  checkpoint_every: 10
  debug: false
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  max_train_steps: null
  max_val_steps: null
  num_epochs: 3050  # LIBERO-10需要更多epoch训练
  resume: true
  rollout_every: 50
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1
  mixed_precision: 'fp16'
  
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    monitor_key: test_mean_score
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 1
    mode: max

ema:
  _target_: unified_video_action.model.autoregressive.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

logging:
  group: null
  id: null
  mode: offline  # 改为offline模式，避免wandb API key问题
  name: train_uva_libero10_mlp_bayesian_production
  project: unified_video_action
  resume: false
  tags:
  - train_uva_libero10
  - libero10
  - mlp
  - bayesian_optimization
  - production

multi_run:
  run_dir: data/outputs/train_uva_libero10_mlp_bayesian_production_resume
  wandb_name_base: train_uva_libero10_mlp_bayesian_production_resume

payload: ./checkpoints/libero10.ckpt
freeze_submodules: true
strict_loading: false  # 允许忽略不匹配的层

save_folder: ./logs/time_logs/libero10_mlp_ucgm_few_steps_sample_4

# Bayesian Optimization Configuration for Production
bayesian_optimization:
  enabled: true
  optimization_mode: "balanced"  # speed_priority, performance_priority, or balanced
  start_epoch: 2200  # 从75%位置开始（3050*3/4=2288），确保训练稳定性
  interval: 10      # 每10个epoch优化一次
  max_trials: 10    # 中期优化用15个trials
  final_trials: 15  # 最终优化用20个trials
  n_test: 5         # 正常优化用5个test
  final_n_test: 8   # 最终优化用8个test，更充分的评估
  device: cuda:0
  output_dir: ./bayesian_optimization_logs
  use_best_checkpoint_for_final: true  # 最终优化使用最优checkpoint
